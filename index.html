<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asian Street Food Empire</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0d0221, #190535, #02010a);
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 650px;
            margin: auto;
            background: rgba(20, 10, 35, 0.9);
            border: 3px solid #ff0055;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 25px #ff0055, inset 0 0 15px #00f0ff;
        }
        h1 {
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055;
            margin-bottom: 5px;
        }
        .neon-text {
            color: #00f0ff;
            text-shadow: 0 0 8px #00f0ff;
            font-style: italic;
        }
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ffda79;
            margin: 15px 0;
            font-size: 18px;
            font-weight: bold;
        }
        .order-card {
            background: #25103a;
            border: 2px solid #00f0ff;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 0 10px #00f0ff;
        }
        .ingredients-box {
            background: #120624;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            border: 1px dashed #ffda79;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
            padding: 5px;
        }
        button {
            background: #1a0826;
            color: #fff;
            border: 2px solid #ff0055;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover:not(:disabled) {
            background: #ff0055;
            box-shadow: 0 0 10px #ff0055;
        }
        button:disabled {
            opacity: 0.5;
            border-color: #555;
            cursor: not-allowed;
        }
        .clean-btn {
            background: #00f0ff;
            color: #000;
            border: none;
            width: 100%;
            margin-top: 10px;
            font-size: 16px;
        }
        .clean-btn:hover {
            background: #ffda79;
            box-shadow: 0 0 10px #ffda79;
        }
        #log {
            margin-top: 10px;
            font-weight: bold;
            min-height: 25px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⛩️ ASIAN STREET FOOD NIGHT MARKET 🏮</h1>
    <p class="neon-text">✨ Neon Food Stall - Cook, Clean & Unlock Street Delicacies ✨</p>

    <div class="stats-bar">
        <span>💰 Score: <span id="score" style="color: #00f0ff;">0</span> pts</span>
        <span>🧹 Kitchen Cleanliness: <span id="cleanliness" style="color: #ffda79;">100%</span></span>
    </div>

    <div class="order-card">
        <h3>Current Customer Order:</h3>
        <h2 id="current-order" style="color: #ff0055;">Loading...</h2>
        <div class="ingredients-box">
            <strong>Required Ingredients:</strong>
            <p id="recipe-ingredients" style="color: #ffda79;">-</p>
        </div>
    </div>

    <button class="clean-btn" onclick="cleanKitchen()">🧹 Clean Kitchen (+15 pts & restores cleanliness)</button>

    <h3> Asian Street Foods Menu (20 Dishes):</h3>
    <div class="grid" id="menu-grid"></div>

    <p id="log"></p>
</div>

<script>
    const streetFoods = [
        { name: "Ramen", reqScore: 0, ingredients: ["Noodles", "Broth", "Egg"] },
        { name: "Pad Thai", reqScore: 50, ingredients: ["Rice Noodles", "Peanuts", "Tofu"] },
        { name: "Takoyaki", reqScore: 100, ingredients: ["Octopus", "Batter", "Mayo"] },
        { name: "Bao Buns", reqScore: 150, ingredients: ["Pork", "Steamed Bun", "Hoisin"] },
        { name: "Dim Sum", reqScore: 200, ingredients: ["Dumpling Wrapper", "Shrimp", "Chili Oil"] },
        { name: "Tanghulu", reqScore: 250, ingredients: ["Strawberries", "Sugar Syrup", "Skewer"] },
        { name: "Boba Tea", reqScore: 300, ingredients: ["Tapioca Pearls", "Milk Tea", "Ice"] },
        { name: "Satay Skewers", reqScore: 350, ingredients: ["Chicken", "Peanut Sauce", "Cucumber"] },
        { name: "Gyoza", reqScore: 400, ingredients: ["Minced Meat", "Cabbage", "Soy Sauce"] },
        { name: "Banh Mi", reqScore: 450, ingredients: ["Baguette", "Pate", "Pickled Veggies"] },
        { name: "Taiyaki", reqScore: 500, ingredients: ["Waffle Batter", "Red Bean Paste", "Custard"] },
        { name: "Okonomiyaki", reqScore: 550, ingredients: ["Cabbage", "Batter", "Bonito Flakes"] },
        { name: "Kimbap", reqScore: 600, ingredients: ["Seaweed", "Rice", "Pickled Radish"] },
        { name: "Hotteok", reqScore: 650, ingredients: ["Sweet Dough", "Brown Sugar", "Cinnamon"] },
        { name: "Tteokbokki", reqScore: 700, ingredients: ["Rice Cakes", "Gochujang", "Fish Cakes"] },
        { name: "Jianbing", reqScore: 750, ingredients: ["Crepe", "Egg", "Crispy Wonton"] },
        { name: "Spring Rolls", reqScore: 800, ingredients: ["Rice Paper", "Shrimp", "Herbs"] },
        { name: "Lumpia", reqScore: 850, ingredients: ["Spring Roll Wrapper", "Pork", "Carrots"] },
        { name: "Egg Waffle", reqScore: 900, ingredients: ["Egg Batter", "Sugar", "Condensed Milk"] },
        { name: "Stinky Tofu", reqScore: 1000, ingredients: ["Fermented Tofu", "Garlic", "Chili Sauce"] }
    ];

    let score = 0;
    let cleanliness = 100;
    let currentOrder = null;

    function initMenu() {
        const grid = document.getElementById("menu-grid");
        grid.innerHTML = "";
        streetFoods.forEach((food) => {
            const btn = document.createElement("button");
            const isUnlocked = score >= food.reqScore;
            btn.id = "btn-" + food.name.replace(/\s+/g, '');
            btn.disabled = !isUnlocked;
            btn.innerHTML = isUnlocked ? food.name : `🔒 ${food.name} (${food.reqScore} pts)`;
            btn.onclick = () => serveFood(food);
            grid.appendChild(btn);
        });
    }

    function generateOrder() {
        const unlockedFoods = streetFoods.filter(f => score >= f.reqScore);
        currentOrder = unlockedFoods[Math.floor(Math.random() * unlockedFoods.length)];
        document.getElementById("current-order").innerText = currentOrder.name;
        document.getElementById("recipe-ingredients").innerText = currentOrder.ingredients.join(" + ");
    }

    function serveFood(food) {
        const log = document.getElementById("log");
        if (cleanliness <= 10) {
            log.style.color = "#ff0055";
            log.innerText = "⚠️ Kitchen is too dirty! Clean it first to serve customers.";
            return;
        }

        if (food.name === currentOrder.name) {
            score += 20;
            cleanliness = Math.max(0, cleanliness - 10);
            log.style.color = "#00f0ff";
            log.innerText = ` Perfect! Served ${food.name} (+20 pts). Kitchen got a bit dirty.`;
            updateGame();
            generateOrder();
        } else {
            log.style.color = "#ff0055";
            log.innerText = "❌ Wrong dish! Customer left unsatisfied.";
        }
    }

    function cleanKitchen() {
        score += 15;
        cleanliness = 100;
        document.getElementById("log").style.color = "#ffda79";
        document.getElementById("log").innerText = "🧹 Kitchen thoroughly cleaned! (+15 pts)";
        updateGame();
    }

    function updateGame() {
        document.getElementById("score").innerText = score;
        document.getElementById("cleanliness").innerText = cleanliness + "%";
        initMenu();
    }

    initMenu();
    generateOrder();
</script>

</body>
</html>
