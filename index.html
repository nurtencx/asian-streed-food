<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asian Street Food Cafe Empire</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f051d;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        .game-container {
            max-width: 750px;
            margin: auto;
            background: #1b0a2a;
            border: 3px solid #ff0055;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 0 20px #ff0055;
        }
        h1 { color: #ff0055; margin: 5px 0; text-shadow: 0 0 10px #ff0055; }
        .score-bar {
            display: flex;
            justify-content: space-around;
            background: #2a123d;
            padding: 10px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            border: 1px solid #00f0ff;
            margin-bottom: 15px;
        }

        .cafe-floor {
            background: linear-gradient(45deg, #2c163f 25%, #231034 25%, #231034 50%, #2c163f 50%, #2c163f 75%, #231034 75%, #231034 100%);
            background-size: 40px 40px;
            border: 3px solid #ffda79;
            border-radius: 12px;
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        .kitchen-area {
            background: rgba(0, 0, 0, 0.4);
            border: 2px dashed #ff0055;
            border-radius: 10px;
            padding: 10px;
        }
        .tables-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .table-box {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #00f0ff;
            border-radius: 10px;
            padding: 10px;
            min-height: 95px;
            position: relative;
        }
        .table-dirty { border-color: #ff0055; background: rgba(255, 0, 85, 0.15); }
        .table-occupied { border-color: #ffda79; }

        .chef-icon { font-size: 30px; animation: cook 1.5s infinite alternate; }
        @keyframes cook { from { transform: scale(1); } to { transform: scale(1.1); } }

        .btn {
            background: #ff0055;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        .btn:hover { background: #ffda79; color: #000; }
        .btn-clean { background: #00f0ff; color: #000; display: none; margin: 10px auto 0 auto; }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
            background: #120520;
            padding: 8px;
            border-radius: 8px;
        }
        .menu-btn {
            background: #230d37;
            color: #fff;
            border: 1px solid #ff0055;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }
        .menu-btn:disabled { opacity: 0.4; border-color: #444; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>⛩️ ASIAN STREET CAFELAND 🏮</h1>
    <p style="color: #00f0ff; margin-bottom: 10px;">Serve 5 dishes to trigger kitchen cleaning. Clean tables after each customer!</p>

    <div class="score-bar">
        <span>💰 Score: <span id="score" style="color: #00f0ff;">0</span> pts</span>
        <span>🍳 Dished Served: <span id="dish-count" style="color: #ffda79;">0 / 5</span></span>
        <span>👨‍🍳 Kitchen: <span id="kitchen-status" style="color: #1dd1a1;">Clean</span></span>
    </div>

    <div class="cafe-floor">
        <div class="kitchen-area">
            <h3>🍳 Kitchen</h3>
            <div class="chef-icon">👨‍🍳</div>
            <p style="font-size: 12px; color: #ffda79;">Master Chef Lee</p>
            <button class="btn btn-clean" id="kitchen-clean-btn" onclick="cleanKitchen()">🧹 Clean Kitchen (+15 pts)</button>
        </div>

        <div class="tables-area" id="tables-container"></div>
    </div>

    <h3>📜 Asian Street Foods Menu (20 Items):</h3>
    <div class="menu-grid" id="menu-grid"></div>

    <p id="log" style="font-weight: bold; min-height: 20px; color: #ffda79; margin-top: 10px;"></p>
</div>

<script>
    const streetFoods = [
        { name: "Ramen", reqScore: 0 },
        { name: "Pad Thai", reqScore: 40 },
        { name: "Takoyaki", reqScore: 80 },
        { name: "Bao Buns", reqScore: 120 },
        { name: "Dim Sum", reqScore: 160 },
        { name: "Tanghulu", reqScore: 200 },
        { name: "Boba Tea", reqScore: 240 },
        { name: "Satay Skewers", reqScore: 280 },
        { name: "Gyoza", reqScore: 320 },
        { name: "Banh Mi", reqScore: 360 },
        { name: "Taiyaki", reqScore: 400 },
        { name: "Okonomiyaki", reqScore: 440 },
        { name: "Kimbap", reqScore: 480 },
        { name: "Hotteok", reqScore: 520 },
        { name: "Tteokbokki", reqScore: 560 },
        { name: "Jianbing", reqScore: 600 },
        { name: "Spring Rolls", reqScore: 640 },
        { name: "Lumpia", reqScore: 680 },
        { name: "Egg Waffle", reqScore: 720 },
        { name: "Stinky Tofu", reqScore: 800 }
    ];

    let score = 0;
    let servedCount = 0;
    let isKitchenDirty = false;

    const tables = [
        { id: 1, status: "empty", customer: null, order: null },
        { id: 2, status: "empty", customer: null, order: null },
        { id: 3, status: "empty", customer: null, order: null },
        { id: 4, status: "empty", customer: null, order: null }
    ];

    const customerAvatars = ["🧑", "👩", "🧔", "👧", "👨‍🌾"];

    function renderTables() {
        const container = document.getElementById("tables-container");
        container.innerHTML = "";

        tables.forEach(table => {
            const box = document.createElement("div");
            box.className = `table-box ${table.status === 'dirty' ? 'table-dirty' : ''} ${table.status === 'occupied' || table.status === 'ordered' ? 'table-occupied' : ''}`;
            
            let content = `<small style="color:#00f0ff;">Table ${table.id}</small><br>`;
            content += `<span style="font-size:18px;">🪑🍽️🪑</span><br>`;

            if (table.status === "empty") {
                content += `<button class="btn" style="font-size:10px;" onclick="seatCustomer(${table.id})">🧍 Seat Customer</button>`;
            } else if (table.status === "occupied") {
                content += `<span style="font-size:20px;">${table.customer}</span><br>`;
                content += `<button class="btn" style="font-size:10px; background:#ffda79; color:#000;" onclick="takeOrder(${table.id})">📋 Take Order</button>`;
            } else if (table.status === "ordered") {
                content += `<span style="font-size:18px;">${table.customer}</span> <small style="color:#ffda79;">Wants: <b>${table.order.name}</b></small><br>`;
                content += `<small style="color:#00f0ff;">Select dish below!</small>`;
            } else if (table.status === "dirty") {
                content += `<span style="font-size:14px; color:#ff0055;">🧽 Dirty Table</span><br>`;
                content += `<button class="btn" style="background:#00f0ff; color:#000; font-size:10px;" onclick="cleanTable(${table.id})">🧽 Clean Table (+15 pts)</button>`;
            }

            box.innerHTML = content;
            container.appendChild(box);
        });
    }

    function seatCustomer(tableId) {
        const t = tables.find(x => x.id === tableId);
        if (t.status === "empty") {
            t.status = "occupied";
            t.customer = customerAvatars[Math.floor(Math.random() * customerAvatars.length)];
            renderTables();
            document.getElementById("log").innerText = `Customer sat at Table ${tableId}! Take their order.`;
        }
    }

    function takeOrder(tableId) {
        const t = tables.find(x => x.id === tableId);
        const unlockedFoods = streetFoods.filter(f => score >= f.reqScore);
        t.order = unlockedFoods[Math.floor(Math.random() * unlockedFoods.length)];
        t.status = "ordered";
        renderTables();
        document.getElementById("log").innerText = `Table ${tableId} ordered ${t.order.name}! Click the dish in menu to serve.`;
    }

    function serveFood(food) {
        if (isKitchenDirty) {
            document.getElementById("log").style.color = "#ff0055";
            document.getElementById("log").innerText = "⚠️ Kitchen is dirty after 5 dishes! Clean kitchen first.";
            return;
        }

        const activeTable = tables.find(t => t.status === "ordered" && t.order.name === food.name);
        
        if (!activeTable) {
            document.getElementById("log").style.color = "#ff0055";
            document.getElementById("log").innerText = "❌ No table currently ordered " + food.name + "!";
            return;
        }

        score += 25;
        servedCount++;
        
        // Müşteri kalkar, MASA KİRLENİR
        activeTable.status = "dirty";
        activeTable.customer = null;
        activeTable.order = null;
        
        // 5 YEMEK KURALI - MUTFAK KİRLENİR VE TEMİZLE BUTONU AÇILIR
        if (servedCount >= 5) {
            isKitchenDirty = true;
            document.getElementById("kitchen-status").innerText = "Dirty!";
            document.getElementById("kitchen-status").style.color = "#ff0055";
            document.getElementById("kitchen-clean-btn").style.display = "block";
        }

        document.getElementById("score").innerText = score;
        document.getElementById("dish-count").innerText = `${servedCount} / 5`;
        document.getElementById("log").style.color = "#1dd1a1";
        document.getElementById("log").innerText = ` Served ${food.name} (+25 pts)! Clean Table ${activeTable.id} for new customer.`;
        
        renderTables();
        renderMenu();
    }

    function cleanTable(tableId) {
        const t = tables.find(x => x.id === tableId);
        t.status = "empty";
        score += 15;
        document.getElementById("score").innerText = score;
        document.getElementById("log").style.color = "#00f0ff";
        document.getElementById("log").innerText = `🧽 Table ${tableId} cleaned (+15 pts)! Ready for new customer.`;
        renderTables();
        renderMenu();
    }

    function cleanKitchen() {
        servedCount = 0;
        isKitchenDirty = false;
        score += 15;
        document.getElementById("score").innerText = score;
        document.getElementById("dish-count").innerText = `0 / 5`;
        document.getElementById("kitchen-status").innerText = "Clean";
        document.getElementById("kitchen-status").style.color = "#1dd1a1";
        document.getElementById("kitchen-clean-btn").style.display = "none";
        document.getElementById("log").style.color = "#ffda79";
        document.getElementById("log").innerText = "🍳 Kitchen cleaned! Chef Lee can now prepare 5 more dishes (+15 pts).";
        renderMenu();
    }

    function renderMenu() {
        const grid = document.getElementById("menu-grid");
        grid.innerHTML = "";
        streetFoods.forEach(food => {
            const btn = document.createElement("button");
            btn.className = "menu-btn";
            const isUnlocked = score >= food.reqScore;
            btn.disabled = !isUnlocked;
            btn.innerHTML = isUnlocked ? `🍳 ${food.name}` : `🔒 ${food.name} (${food.reqScore} pts)`;
            btn.onclick = () => serveFood(food);
            grid.appendChild(btn);
        });
    }

    renderTables();
    renderMenu();
</script>

</body>
</html>
