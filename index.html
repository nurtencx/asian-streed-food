<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asian Street Food Cafe Empire</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f051d;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        .game-container {
            max-width: 750px;
            margin: auto;
            background: #1b0a2a;
            border: 3px solid #ff0055;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 0 20px #ff0055;
        }
        h1 { color: #ff0055; margin: 5px 0; text-shadow: 0 0 10px #ff0055; }
        .score-bar {
            display: flex;
            justify-content: space-around;
            background: #2a123d;
            padding: 10px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            border: 1px solid #00f0ff;
            margin-bottom: 15px;
        }

        /* CAFELAND STYLE FLOOR PLAN */
        .cafe-floor {
            background: linear-gradient(45deg, #2c163f 25%, #231034 25%, #231034 50%, #2c163f 50%, #2c163f 75%, #231034 75%, #231034 100%);
            background-size: 40px 40px;
            border: 3px solid #ffda79;
            border-radius: 12px;
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        .kitchen-area {
            background: rgba(0, 0, 0, 0.4);
            border: 2px dashed #ff0055;
            border-radius: 10px;
            padding: 10px;
        }
        .tables-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .table-box {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #00f0ff;
            border-radius: 10px;
            padding: 10px;
            min-height: 90px;
            position: relative;
        }
        .table-dirty { border-color: #ff0055; background: rgba(255, 0, 85, 0.1); }
        .table-occupied { border-color: #ffda79; }

        .chef-icon { font-size: 30px; animation: cook 1.5s infinite alternate; }
        @keyframes cook { from { transform: scale(1); } to { transform: scale(1.1); } }

        .btn {
            background: #ff0055;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        .btn:hover { background: #ffda79; color: #000; }
        .btn-clean { background: #00f0ff; color: #000; }

        /* MENU GRID */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
            background: #120520;
            padding: 8px;
            border-radius: 8px;
        }
        .menu-btn {
            background: #230d37;
            color: #fff;
            border: 1px solid #ff0055;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }
        .menu-btn:disabled { opacity: 0.4; border-color: #444; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>⛩️ ASIAN STREET CAFELAND 🏮</h1>
    <p style="color: #00f0ff; margin-bottom: 10px;">Serve customers at your Asian Night Market Cafe!</p>

    <div class="score-bar">
        <span>💰 Score: <span id="score" style="color: #00f0ff;">0</span> pts</span>
        <span>👨‍🍳 Chef Status: <span style="color: #ffda79;">Cooking</span></span>
    </div>

    <!-- CAFELAND FLOOR PLAN -->
    <div class="cafe-floor">
        <!-- KITCHEN -->
        <div class="kitchen-area">
            <h3>🍳 Kitchen</h3>
            <div class="chef-icon">👨‍🍳</div>
            <p style="font-size: 12px; color: #ffda79;">Master Chef Lee</p>
            <button class="btn btn-clean" onclick="cleanKitchen()">🧹 Clean Kitchen (+15 pts)</button>
        </div>

        <!-- DINING AREA WITH TABLES & CHAIRS -->
        <div class="tables-area" id="tables-container">
            <!-- Tables will be generated here -->
        </div>
    </div>

    <h3>📜 Asian Street Foods Menu (20 Items):</h3>
    <div class="menu-grid" id="menu-grid"></div>

    <p id="log" style="font-weight: bold; min-height: 20px; color: #ffda79; margin-top: 10px;"></p>
</div>

<script>
    const streetFoods = [
        { name: "Ramen", reqScore: 0, ingredients: ["Noodles", "Broth", "Egg"] },
        { name: "Pad Thai", reqScore: 40, ingredients: ["Rice Noodles", "Peanuts"] },
        { name: "Takoyaki", reqScore: 80, ingredients: ["Octopus", "Batter"] },
        { name: "Bao Buns", reqScore: 120, ingredients: ["Pork", "Steamed Bun"] },
        { name: "Dim Sum", reqScore: 160, ingredients: ["Dumpling Wrapper", "Shrimp"] },
        { name: "Tanghulu", reqScore: 200, ingredients: ["Strawberries", "Sugar"] },
        { name: "Boba Tea", reqScore: 240, ingredients: ["Tapioca", "Milk Tea"] },
        { name: "Satay Skewers", reqScore: 280, ingredients: ["Chicken", "Peanut Sauce"] },
        { name: "Gyoza", reqScore: 320, ingredients: ["Meat", "Soy Sauce"] },
        { name: "Banh Mi", reqScore: 360, ingredients: ["Baguette", "Pate"] },
        { name: "Taiyaki", reqScore: 400, ingredients: ["Waffle Batter", "Red Bean"] },
        { name: "Okonomiyaki", reqScore: 440, ingredients: ["Cabbage", "Bonito Flakes"] },
        { name: "Kimbap", reqScore: 480, ingredients: ["Seaweed", "Rice"] },
        { name: "Hotteok", reqScore: 520, ingredients: ["Dough", "Brown Sugar"] },
        { name: "Tteokbokki", reqScore: 560, ingredients: ["Rice Cakes", "Gochujang"] },
        { name: "Jianbing", reqScore: 600, ingredients: ["Crepe", "Egg"] },
        { name: "Spring Rolls", reqScore: 640, ingredients: ["Rice Paper", "Shrimp"] },
        { name: "Lumpia", reqScore: 680, ingredients: ["Wrapper", "Pork"] },
        { name: "Egg Waffle", reqScore: 720, ingredients: ["Batter", "Sugar"] },
        { name: "Stinky Tofu", reqScore: 800, ingredients: ["Fermented Tofu", "Chili"] }
    ];

    let score = 0;
    let selectedTable = null;

    const tables = [
        { id: 1, status: "empty", customer: null, order: null },
        { id: 2, status: "empty", customer: null, order: null },
        { id: 3, status: "empty", customer: null, order: null },
        { id: 4, status: "empty", customer: null, order: null }
    ];

    const customerAvatars = ["🧑", "👩", "🧔", "👧", "👨‍🌾"];

    function renderTables() {
        const container = document.getElementById("tables-container");
        container.innerHTML = "";

        tables.forEach(table => {
            const box = document.createElement("div");
            box.className = `table-box ${table.status === 'dirty' ? 'table-dirty' : ''} ${table.status === 'occupied' || table.status === 'ordered' ? 'table-occupied' : ''}`;
            
            let content = `<small style="color:#00f0ff;">Table ${table.id}</id></small><br>`;
            content += `<span style="font-size:20px;">🪑🍽️🪑</span><br>`;

            if (table.status === "empty") {
                content += `<button class="btn" style="font-size:10px;" onclick="seatCustomer(${table.id})">🧍 Seat Customer</button>`;
            } else if (table.status === "occupied") {
                content += `<span style="font-size:22px;">${table.customer}</span><br>`;
                content += `<button class="btn" style="font-size:10px; background:#ffda79; color:#000;" onclick="takeOrder(${table.id})">📋 Take Order</button>`;
            } else if (table.status === "ordered") {
                content += `<span style="font-size:20px;">${table.customer}</span> <small style="color:#ffda79;">Wants: <b>${table.order.name}</b></small><br>`;
                content += `<small style="color:#00f0ff;">Select dish from menu below!</small>`;
            } else if (table.status === "dirty") {
                content += `<span style="font-size:16px;">🧽 Dirty Table</span><br>`;
                content += `<button class="btn btn-clean" style="font-size:10px;" onclick="cleanTable(${table.id})">🧽 Clean Table (+15 pts)</button>`;
            }

            box.innerHTML = content;
            container.appendChild(box);
        });
    }

    function seatCustomer(tableId) {
        const t = tables.find(x => x.id === tableId);
        if (t.status === "empty") {
            t.status = "occupied";
            t.customer = customerAvatars[Math.floor(Math.random() * customerAvatars.length)];
            renderTables();
            document.getElementById("log").innerText = `Customer sat at Table ${tableId}! Take their order.`;
        }
    }

    function takeOrder(tableId) {
        const t = tables.find(x => x.id === tableId);
        const unlockedFoods = streetFoods.filter(f => score >= f.reqScore);
        t.order = unlockedFoods[Math.floor(Math.random() * unlockedFoods.length)];
        t.status = "ordered";
        selectedTable = t;
        renderTables();
        document.getElementById("log").innerText = `Table ${tableId} ordered ${t.order.name}! Click the dish in the menu to serve.`;
    }

    function serveFood(food) {
        const activeTable = tables.find(t => t.status === "ordered" && t.order.name === food.name);
        
        if (!activeTable) {
            document.getElementById("log").innerText = "❌ No table currently ordered " + food.name + "!";
            return;
        }

        score += 25;
        activeTable.status = "dirty";
        activeTable.customer = null;
        activeTable.order = null;
        
        document.getElementById("score").innerText = score;
        document.getElementById("log").innerText = ` Served ${food.name} to Table ${activeTable.id}! (+25 pts). Table needs cleaning now.`;
        
        renderTables();
        renderMenu();
    }

    function cleanTable(tableId) {
        const t = tables.find(x => x.id === tableId);
        t.status = "empty";
        score += 15;
        document.getElementById("score").innerText = score;
        document.getElementById("log").innerText = `🧽 Table ${tableId} cleaned! Ready for new customers (+15 pts).`;
        renderTables();
        renderMenu();
    }

    function cleanKitchen() {
        score += 15;
        document.getElementById("score").innerText = score;
        document.getElementById("log").innerText = "🍳 Kitchen thoroughly cleaned! (+15 pts)";
        renderMenu();
    }

    function renderMenu() {
        const grid = document.getElementById("menu-grid");
        grid.innerHTML = "";
        streetFoods.forEach(food => {
            const btn = document.createElement("button");
            btn.className = "menu-btn";
            const isUnlocked = score >= food.reqScore;
            btn.disabled = !isUnlocked;
            btn.innerHTML = isUnlocked ? `🍳 ${food.name}` : `🔒 ${food.name} (${food.reqScore} pts)`;
            btn.onclick = () => serveFood(food);
            grid.appendChild(btn);
        });
    }

    renderTables();
    renderMenu();
</script>

</body>
</html>
